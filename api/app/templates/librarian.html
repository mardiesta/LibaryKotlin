<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Выдача книг</title>
  <style>
    :root {
      --ink: #1c1915;
      --muted: #6d6458;
      --paper: #f3eee4;
      --card: #fffdf8;
      --line: #e3d8c8;
      --green: #1f4d3a;
      --green-deep: #16382a;
      --warn: #8a4b12;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: Georgia, "Iowan Old Style", Palatino, serif;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 20px 28px;
      background: var(--green);
      color: #f6f1e7;
    }
    header h1 { margin: 0; font-size: 28px; font-weight: 500; }
    header p { margin: 4px 0 0; font-family: "Segoe UI", sans-serif; font-size: 14px; opacity: 0.85; }
    button, input {
      font-family: "Segoe UI", sans-serif;
    }
    main { max-width: 980px; margin: 0 auto; padding: 28px 20px 48px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
    }
    form { display: grid; gap: 12px; max-width: 420px; }
    label { display: grid; gap: 6px; font-family: "Segoe UI", sans-serif; font-size: 14px; }
    input {
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
      font-size: 16px;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      background: var(--green);
      color: #f6f1e7;
      cursor: pointer;
    }
    button.secondary { background: transparent; color: var(--green-deep); border: 1px solid var(--line); }
    button.warn { background: var(--warn); }
    button:disabled { opacity: 0.6; cursor: default; }
    .message {
      margin: 0 0 16px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #f8e6d4;
      color: var(--warn);
      font-family: "Segoe UI", sans-serif;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left;
      padding: 12px 10px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    th {
      font-family: "Segoe UI", sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }
    .status { font-family: "Segoe UI", sans-serif; font-size: 14px; }
    .empty { color: var(--muted); font-family: "Segoe UI", sans-serif; }
    .hidden { display: none; }
    #logout { background: transparent; color: #f6f1e7; border: 1px solid rgba(246, 241, 231, 0.4); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Выдача книг</h1>
      <p>Бронь читателя становится выдачей только после подтверждения</p>
    </div>
    <button id="logout" class="hidden" type="button">Выйти</button>
  </header>
  <main>
    <p id="message" class="message hidden"></p>
    <section id="login" class="card">
      <form id="login-form">
        <label>Email
          <input id="email" type="email" autocomplete="username" value="librarian@library.local" required>
        </label>
        <label>Пароль
          <input id="password" type="password" autocomplete="current-password" value="librarian" required>
        </label>
        <button type="submit">Войти</button>
      </form>
    </section>
    <section id="desk" class="card hidden">
      <table>
        <thead>
          <tr>
            <th>Читатель</th>
            <th>Книга</th>
            <th>Статус</th>
            <th>Срок</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" class="empty hidden">Нет броней и выданных книг</p>
    </section>
  </main>
  <script>
    const tokenKey = "library_token";
    const message = document.querySelector("#message");
    const login = document.querySelector("#login");
    const desk = document.querySelector("#desk");
    const logout = document.querySelector("#logout");
    const rows = document.querySelector("#rows");
    const empty = document.querySelector("#empty");

    function showMessage(text) {
      message.textContent = text;
      message.classList.toggle("hidden", !text);
    }

    function formatDate(value) {
      if (!value) return "—";
      const [year, month, day] = value.slice(0, 10).split("-");
      return day + "." + month + "." + year;
    }

    async function api(path, options) {
      const headers = { ...(options && options.headers) };
      const token = sessionStorage.getItem(tokenKey);
      if (token) headers.Authorization = "Bearer " + token;
      if (options && options.body) headers["Content-Type"] = "application/json";
      const response = await fetch(path, { ...options, headers });
      if (response.status === 204) return null;
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        const error = new Error(typeof data.detail === "string" ? data.detail : "Не удалось выполнить запрос");
        error.status = response.status;
        throw error;
      }
      return data;
    }

    function showLogin() {
      login.classList.remove("hidden");
      desk.classList.add("hidden");
      logout.classList.add("hidden");
    }

    function showDesk() {
      login.classList.add("hidden");
      desk.classList.remove("hidden");
      logout.classList.remove("hidden");
    }

    function render(loans) {
      rows.replaceChildren();
      empty.classList.toggle("hidden", loans.length > 0);
      loans.forEach((loan) => {
        const tr = document.createElement("tr");
        const reader = document.createElement("td");
        reader.textContent = loan.reader_name;
        const email = document.createElement("div");
        email.textContent = loan.reader_email;
        email.style.color = "#6d6458";
        email.style.fontFamily = "Segoe UI, sans-serif";
        email.style.fontSize = "13px";
        reader.appendChild(email);
        const book = document.createElement("td");
        book.textContent = loan.title;
        const author = document.createElement("div");
        author.textContent = loan.author;
        author.style.color = "#6d6458";
        author.style.fontFamily = "Segoe UI, sans-serif";
        author.style.fontSize = "13px";
        book.appendChild(author);
        const status = document.createElement("td");
        status.className = "status";
        status.textContent = loan.status === "reserved" ? "Забронирована" : "На руках";
        const due = document.createElement("td");
        due.textContent = loan.status === "issued" ? formatDate(loan.due_date) : "—";
        const action = document.createElement("td");
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = loan.status === "reserved" ? "Выдать" : "Принять возврат";
        if (loan.status !== "reserved") button.className = "warn";
        button.addEventListener("click", () => act(loan, button));
        action.appendChild(button);
        tr.append(reader, book, status, due, action);
        rows.appendChild(tr);
      });
    }

    async function loadLoans() {
      showMessage("");
      const loans = await api("/librarian/loans");
      showDesk();
      render(loans);
    }

    async function act(loan, button) {
      button.disabled = true;
      const path = loan.status === "reserved"
        ? "/librarian/loans/" + loan.id + "/issue"
        : "/librarian/loans/" + loan.id + "/return";
      try {
        await api(path, { method: "POST" });
        await loadLoans();
      } catch (error) {
        showMessage(error.message);
        button.disabled = false;
      }
    }

    document.querySelector("#login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      showMessage("");
      try {
        const data = await api("/auth/login", {
          method: "POST",
          body: JSON.stringify({
            email: document.querySelector("#email").value,
            password: document.querySelector("#password").value,
          }),
        });
        if (data.user.role !== "librarian") {
          showMessage("Эта страница только для библиотекаря");
          return;
        }
        sessionStorage.setItem(tokenKey, data.access_token);
        await loadLoans();
      } catch (error) {
        showMessage(error.message);
      }
    });

    logout.addEventListener("click", () => {
      sessionStorage.removeItem(tokenKey);
      showLogin();
      showMessage("");
    });

    if (sessionStorage.getItem(tokenKey)) {
      loadLoans().catch((error) => {
        sessionStorage.removeItem(tokenKey);
        showLogin();
        showMessage(error.message);
      });
    }
  </script>
</body>
</html>
